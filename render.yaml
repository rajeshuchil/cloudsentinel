services:
  - type: web
    name: cloudsentinel-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://cloudsentinel.aistudio.google.com
